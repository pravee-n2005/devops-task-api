name: CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: devops-task-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 using SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0b97c11493082a4f5 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "REGISTRY=030606694522.dkr.ecr.ap-southeast-2.amazonaws.com",
              "IMAGE=$REGISTRY/devops-task-api:${{ github.sha }}",
              "aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin $REGISTRY",
              "docker pull $IMAGE",
              "docker start task-db 2>/dev/null || true",
              "docker rm -f task-api 2>/dev/null || true",
              "docker run -d --name task-api --network task-network -p 3000:3000 -e PORT=3000 -e DB_HOST=task-db -e DB_PORT=5432 -e DB_NAME=taskdb -e DB_USER=postgres -e DB_PASSWORD=postgres $IMAGE",
              "sleep 5",
              "curl -f http://localhost:3000/health"
            ]' \
            --region ap-southeast-2 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0b97c11493082a4f5 \
            --region ap-southeast-2

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0b97c11493082a4f5 \
            --region ap-southeast-2 \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0b97c11493082a4f5 \
            --region ap-southeast-2

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi